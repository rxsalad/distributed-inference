# ---- Router (CPU Pod) ----
# Needs to read Pods and StatefulSets (expected node count, wait for Ready, get Pod IPs)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdd-router-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pdd-router-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pdd-router-rb
subjects:
  - kind: ServiceAccount
    name: pdd-router-sa
roleRef:
  kind: Role
  name: pdd-router-role
  apiGroup: rbac.authorization.k8s.io
---
# Entry point: clients send requests to pdd-router:30000
apiVersion: v1
kind: Service
metadata:
  name: pdd-router
spec:
  selector:
    app: pdd-router
  ports:
    - name: http
      port: 30000
      targetPort: 30000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pdd-router
spec:
  serviceName: pdd-router
  replicas: 1
  selector:
    matchLabels:
      app: pdd-router
  template:
    metadata:
      labels:
        app: pdd-router
    spec:
      serviceAccountName: pdd-router-sa
      # Any non-GPU node (the CPU pool name differs between clusters, so do not hard-code it)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: doks.digitalocean.com/gpu-brand
                    operator: DoesNotExist
      volumes:
        - name: scripts
          configMap:
            name: pdd-scripts
            defaultMode: 0755
        - name: hf-cache          # vllm bench needs a tokenizer; cached on the CPU node
          hostPath:
            path: /root/.cache/huggingface
            type: DirectoryOrCreate
      containers:
        - name: router
          # Same image (IMAGE) as Prefill / Decode: it has python, curl and vllm (so vllm bench can run in the Router Pod).
          # vllm-router and the kubernetes client are pip-installed at startup (only new packages are added; packages already in the image are untouched).
          # Note: IMAGE defaults to :latest, so the three workloads may pull different versions at different times; use a pinned tag to keep them identical
          image: ${IMAGE}
          imagePullPolicy: Always
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PREFILL_APP
              value: pdd-prefill
            - name: PREFILL_PORT
              value: "8001"
            - name: DECODE_APP
              value: pdd-decode
            - name: DECODE_PORT
              value: "8002"
            - name: ROUTER_PORT
              value: "30000"
            - name: ROUTER_POLICY
              value: round_robin
            # Must equal --data-parallel-size-local of every vllm serve (LOCAL_DP in pdd-launch.sh)
            - name: INTRA_NODE_DP
              value: "8"
          command: ["/bin/bash", "-ec"]
          args:
            - |
              pip install --no-cache-dir vllm-router kubernetes requests
              exec python3 -u /scripts/pdd-router.py
          ports:
            - containerPort: 30000
              name: http
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: 30000
            periodSeconds: 10
