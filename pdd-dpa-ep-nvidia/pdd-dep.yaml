# PD disaggregation: Prefill pool = DEP, Decode pool = DEP, Router = one CPU Pod.
# Corresponds to Prefill/Decode Disaggregation for DeepSeek-V3 on recipes.vllm.ai (prefill_mode=dep, decode_mode=dep).
#
# This is a template: ${PREFILL_NODES}, ${DECODE_NODES}, ${IMAGE}, ${MODEL}, ${PREFIX_CACHING}, ${HIDE_HEALTH_LOG} and ${UCX_LOG_LEVEL} are filled in by pdd.sh with envsubst.
# The node count of each pool can be set independently: one node = one Pod = 8 GPUs = 8 local DP ranks,
# DP within a pool = nodes x 8, EP = DP (TP=1). E.g. 2P + 2D = 4 nodes, DP16+EP16 per pool.
#
# Deploy / status / delete: ./pdd.sh up | status | down
#   PREFILL_NODES=1 DECODE_NODES=3 ./pdd.sh up
#
# Differences from the recipes page commands:
#   - adds NCCL_IB_GID_INDEX=3 and VLLM_ENGINE_READY_TIMEOUT_S (needed on this cluster, see vllm-expert-parallel/)
#   - drops --chat-template (the relative path inside the image is unverified)
#   - the NIXL side-channel address is the Pod IP (downward API), not $PREFILL_NODE_n from the page
#   - adds UCX_IB_GID_INDEX=3 (inferred: NIXL uses UCX over RoCE, same reasoning as NCCL; unverified)
#   - the Router does not use hard-coded URLs from the page; pdd-router.py discovers the Pods via K8S and then starts vllm-router
---
# Scripts shared by both roles: generated by pdd.sh with kubectl create configmap --from-file, not part of this file
# (ConfigMap pdd-scripts: pdd-launch.sh, pdd-router.py)
#
# ---- Prefill ----
apiVersion: v1
kind: Service
metadata:
  name: pdd-prefill-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # DNS must resolve even before the Pod is Ready (DP coordinator address)
  selector:
    app: pdd-prefill
  ports:
    - name: http
      port: 8001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pdd-prefill
spec:
  serviceName: pdd-prefill-headless
  replicas: ${PREFILL_NODES}
  podManagementPolicy: Parallel   # all nodes in a pool must start together to finish initialization
  selector:
    matchLabels:
      app: pdd-prefill
  template:
    metadata:
      labels:
        app: pdd-prefill
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          roce-net-fabric0@fabric0,
          roce-net-fabric2@fabric2,
          roce-net-fabric4@fabric4,
          roce-net-fabric6@fabric6,
          roce-net-fabric8@fabric8,
          roce-net-fabric10@fabric10,
          roce-net-fabric12@fabric12,
          roce-net-fabric14@fabric14
    spec:
      restartPolicy: Always
      nodeSelector:
        doks.digitalocean.com/gpu-brand: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: hf-cache
          hostPath:
            path: /root/.cache/huggingface
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
        - name: scripts
          configMap:
            name: pdd-scripts
            defaultMode: 0755
      containers:
        - name: server
          image: ${IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: ROLE_APP
              value: pdd-prefill
            - name: KV_ROLE
              value: kv_producer
            - name: HTTP_PORT
              value: "8001"
            - name: SIDE_PORT
              value: "5557"
            - name: NODES
              value: "${PREFILL_NODES}"
            - name: MODEL
              value: ${MODEL}
            - name: PREFIX_CACHING
              value: "${PREFIX_CACHING}"
            - name: HIDE_HEALTH_LOG
              value: "${HIDE_HEALTH_LOG}"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            # Needed on this cluster (measured): otherwise NCCL picks the link-local RoCE GID and cross-node traffic hangs silently
            - name: NCCL_IB_GID_INDEX
              value: "3"
            # Inferred: NIXL's UCX transport also needs the right RoCE GID (unverified)
            - name: UCX_IB_GID_INDEX
              value: "3"
            # Required (measured): the fabricN NICs sit in VRFs, so UCX by default enumerates tcp/fabricN and fails to bind
            # (bind ... Cannot assign requested address -> NIXL_ERR_BACKEND).
            # List only the 8 RoCE devices (GPU i maps to mlx5_{2i}) and keep no eth0 TCP fallback:
            # a fallback would hide RDMA being unavailable (KV transfer would silently go over TCP).
            - name: UCX_NET_DEVICES
              value: "mlx5_0:1,mlx5_2:1,mlx5_4:1,mlx5_6:1,mlx5_8:1,mlx5_10:1,mlx5_12:1,mlx5_14:1"
            # Each rendezvous transfer uses at most 1 rail (UCX default 2, max 4); each worker uses its own NIC,
            # so the 8 workers together still cover all 8 NICs
            - name: UCX_MAX_RNDV_RAILS
              value: "1"
            # DSCP / traffic class for RoCE traffic (value 104 taken from the AMD doc; whether this cluster's switches classify on it is unverified)
            - name: UCX_IB_TRAFFIC_CLASS
              value: "104"
            # UCX log level (switch UCX_LOG_LEVEL in pdd.sh, default info): info shows the transport selection (rc / cuda_copy etc.),
            # devices and rails used, to confirm which path KV transfer takes; it increases log volume at startup and during transfers
            - name: UCX_LOG_LEVEL
              value: "${UCX_LOG_LEVEL}"
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"
          command: ["/bin/bash", "/scripts/pdd-launch.sh"]
          # Startup takes 15-25 minutes: the startupProbe waits up to 1 hour (60 s x 60 tries); readinessProbe only starts after it passes.
          # The 60 s probe period (the usual choice is 10 s) reduces /health access logs; the cost is that a Pod becomes Ready up to 1 minute later and a failure is detected after up to 3 minutes
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 60
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
            - name: scripts
              mountPath: /scripts
          resources:
            limits:
              nvidia.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric2: 10
              rdma/fabric4: 10
              rdma/fabric6: 10
              rdma/fabric8: 10
              rdma/fabric10: 10
              rdma/fabric12: 10
              rdma/fabric14: 10
            requests:
              nvidia.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric2: 10
              rdma/fabric4: 10
              rdma/fabric6: 10
              rdma/fabric8: 10
              rdma/fabric10: 10
              rdma/fabric12: 10
              rdma/fabric14: 10
---
