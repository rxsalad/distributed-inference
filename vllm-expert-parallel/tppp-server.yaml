# Multi-Node TP + Pipeline Parallel (TP8 x PP2, EP 在每个阶段内)：2 个 Pod x 8 x B300 = 1 个 vLLM 实例
# 对应 recipe.md 第 5 节。命令来自 recipes.vllm.ai（hardware=b300, nodes=2, multi_node_tp_pp）。
# 与页面的差异：增加 NCCL_IB_GID_INDEX=3、VLLM_ENGINE_READY_TIMEOUT_S；去掉 --chat-template（镜像里路径未验证）。
# 与 tep-server.yaml 的差异：--tensor-parallel-size 8 --pipeline-parallel-size 2；
# 不加 --disable-custom-all-reduce（TP 组都在节点内，先按页面命令试，卡住再加）。
#
# 部署：kubectl apply -f tppp-server.yaml
# 日志：kubectl logs -f tppp-0
# 验证：kubectl exec tppp-0 -- curl -s localhost:8000/v1/models
# 删除：kubectl delete -f tppp-server.yaml
---
# Headless Service：给 Pod 稳定的 DNS 名（tppp-0.tppp-headless），用于解析 HEAD_IP。
# publishNotReadyAddresses：Pod 还没 Ready 时 DNS 也要能解析（vLLM 服务启动前就要用）。
apiVersion: v1
kind: Service
metadata:
  name: tppp-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: tppp
  ports:
    - name: http
      port: 8000
---
# 对外入口：只指向 tppp-0（主节点，rank 0）。tppp-1 是 headless worker，不提供 API。
apiVersion: v1
kind: Service
metadata:
  name: tppp-api
spec:
  selector:
    statefulset.kubernetes.io/pod-name: tppp-0
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tppp
spec:
  serviceName: tppp-headless
  replicas: 2
  # 两个 Pod 必须同时启动：TP8 x PP2 要所有 rank 都到齐才能完成初始化
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tppp
  template:
    metadata:
      labels:
        app: tppp
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          roce-net-fabric0@fabric0,
          roce-net-fabric2@fabric2,
          roce-net-fabric4@fabric4,
          roce-net-fabric6@fabric6,
          roce-net-fabric8@fabric8,
          roce-net-fabric10@fabric10,
          roce-net-fabric12@fabric12,
          roce-net-fabric14@fabric14
    spec:
      restartPolicy: Always

      nodeSelector:
        doks.digitalocean.com/gpu-brand: nvidia

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      # 两个 Pod 分到不同节点（每个节点 8 卡，本来也只能放一个）
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: tppp
              topologyKey: kubernetes.io/hostname

      volumes:
        - name: hf-cache
          hostPath:
            path: /root/.cache/huggingface
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi

      containers:
        - name: server
          image: vllm/vllm-openai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http

          env:
            # --- 页面给出的环境变量 ---
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            # --- 本集群实测需要（vllm-dp16-ep-two-node.md 6.1）：
            #     不设时 NCCL 会选到链路本地 RoCE GID（fe80::），跨节点不可达，初始化静默卡死
            - name: NCCL_IB_GID_INDEX
              value: "3"
            # --- 权重加载慢，默认 600 秒就绪超时不够（vllm-dp8-ep-single-node.md 2.4）
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"

          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -ex

              # Pod 序号：tppp-0 -> 0（主节点，PP 第 0 阶段），tppp-1 -> 1（headless，PP 第 1 阶段）
              NODE_RANK=${HOSTNAME##*-}
              HEAD_HOST=tppp-0.tppp-headless

              # 等 DNS 解析出主节点 IP，作为 --master-addr
              # 循环直到解析出非空 IP（DNS 有瞬时竞态：getent 可能先返回成功、紧接着取 IP 却为空）
              HEAD_IP=""
              until [ -n "${HEAD_IP}" ]; do
                HEAD_IP=$(getent ahostsv4 ${HEAD_HOST} 2>/dev/null | awk 'NR==1{print $1}')
                [ -n "${HEAD_IP}" ] || { echo "waiting for ${HEAD_HOST} ..."; sleep 2; }
              done
              echo "NODE_RANK=${NODE_RANK} HEAD_IP=${HEAD_IP}"

              # 每个节点的 hostPath 缓存不共享，各自下载（已有缓存时立即返回）
              hf download deepseek-ai/DeepSeek-V3

              EXTRA=""
              if [ "${NODE_RANK}" != "0" ]; then
                EXTRA="--headless"
              fi

              exec vllm serve deepseek-ai/DeepSeek-V3 \
                --trust-remote-code \
                --enable-expert-parallel \
                --tensor-parallel-size 8 \
                --pipeline-parallel-size 2 \
                --nnodes 2 \
                --node-rank ${NODE_RANK} \
                --master-addr ${HEAD_IP} \
                ${EXTRA} \
                --enable-auto-tool-choice \
                --tool-call-parser deepseek_v3 \
                --reasoning-parser deepseek_v3

          securityContext:
            capabilities:
              add:
                - IPC_LOCK

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm

          resources:
            limits:
              nvidia.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric2: 10
              rdma/fabric4: 10
              rdma/fabric6: 10
              rdma/fabric8: 10
              rdma/fabric10: 10
              rdma/fabric12: 10
              rdma/fabric14: 10
            requests:
              nvidia.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric2: 10
              rdma/fabric4: 10
              rdma/fabric6: 10
              rdma/fabric8: 10
              rdma/fabric10: 10
              rdma/fabric12: 10
              rdma/fabric14: 10
