# Single-node DTP8 (DP8 attention + TP8 MoE, no expert parallel): 1 pod x 8 B300 = one vLLM instance.
# Serve command: same as sn-dep8.yaml minus --enable-expert-parallel.
# MoE layout: attention weights are replicated and each GPU serves its own requests;
# MoE is tensor-parallel across all 8 GPUs (each of the 256 routed experts cut into
# 8 pieces), with an all-reduce at the end of every MoE layer.
# The --chat-template relative path is verified to exist in the image (workdir
# /vllm-workspace), so it is kept as-is.
# Single node: no --nnodes/--node-rank/--master-addr and no
# --disable-custom-all-reduce (the TP group stays inside one node).
#
# Deploy:   kubectl apply -f sn-dtp8.yaml
# Logs:     kubectl logs -f dtp8-0
# Verify:   kubectl exec dtp8-0 -- curl -s localhost:8000/v1/models
# Delete:   kubectl delete -f sn-dtp8.yaml
---
# Headless service: required by the StatefulSet (spec.serviceName); gives the pod a
# stable DNS name (dtp8-0.dtp8-headless). Not a client entry point.
apiVersion: v1
kind: Service
metadata:
  name: dtp8-headless
spec:
  clusterIP: None
  # Keep the DNS name resolvable even when the pod is not Ready (startup window / restarts).
  publishNotReadyAddresses: true
  selector:
    app: dtp8
  ports:
    - name: http
      port: 8000
---
# Client entry point: selects all pods by label, so raising replicas load-balances
# across them without changing this service.
apiVersion: v1
kind: Service
metadata:
  name: dtp8-api
spec:
  selector:
    app: dtp8
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dtp8
spec:
  serviceName: dtp8-headless
  # One pod per node; each replica is a standalone DTP8 instance (DP8 fits one node).
  replicas: 1
  selector:
    matchLabels:
      app: dtp8
  template:
    metadata:
      labels:
        app: dtp8
      # Attach the 8 RoCE NICs to the pod (one rail per GPU, GPU i <-> mlx5_2i).
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          roce-net-fabric0@fabric0,
          roce-net-fabric2@fabric2,
          roce-net-fabric4@fabric4,
          roce-net-fabric6@fabric6,
          roce-net-fabric8@fabric8,
          roce-net-fabric10@fabric10,
          roce-net-fabric12@fabric12,
          roce-net-fabric14@fabric14
    spec:
      restartPolicy: Always

      nodeSelector:
        doks.digitalocean.com/gpu-brand: nvidia

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      volumes:
        # Node-local HF cache: survives pod recreation, not shared across nodes.
        - name: hf-cache
          hostPath:
            path: /root/.cache/huggingface
            type: DirectoryOrCreate
        # Shared memory for NCCL / multiprocess; the container default is too small.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi

      containers:
        - name: server
          image: vllm/vllm-openai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http

          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -ex

              # Env vars (not strictly needed on a single node, kept consistent with
              # the other strategies; NCCL_IB_GID_INDEX=3 is mandatory for cross-node
              # RoCE and harmless here).
              export GLOO_SOCKET_IFNAME=eth0
              export NCCL_SOCKET_IFNAME=eth0
              export NCCL_IB_GID_INDEX=3
              # Default 600 s engine-ready timeout is not enough for weight loading
              # plus autotune and CUDA graph capture.
              export VLLM_ENGINE_READY_TIMEOUT_S=3600

              # Warm the node-local HF cache; returns immediately when already present.
              hf download deepseek-ai/DeepSeek-V3

              # DTP8: attention DP8 + MoE TP8, no whole expert per GPU (see header).
              exec vllm serve deepseek-ai/DeepSeek-V3 \
                --trust-remote-code \
                --data-parallel-size 8 \
                --no-enable-prefix-caching \
                --enable-auto-tool-choice \
                --tool-call-parser deepseek_v3 \
                --chat-template examples/tool_chat_template_deepseekv3.jinja \
                --reasoning-parser deepseek_v3

          securityContext:
            capabilities:
              # Allow pinning memory for RDMA.
              add:
                - IPC_LOCK

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm

          resources:
            # All 8 GPUs and 8 RoCE NICs of one node.
            limits:
              nvidia.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric2: 10
              rdma/fabric4: 10
              rdma/fabric6: 10
              rdma/fabric8: 10
              rdma/fabric10: 10
              rdma/fabric12: 10
              rdma/fabric14: 10
            requests:
              nvidia.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric2: 10
              rdma/fabric4: 10
              rdma/fabric6: 10
              rdma/fabric8: 10
              rdma/fabric10: 10
              rdma/fabric12: 10
              rdma/fabric14: 10
