apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdd-router-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pdd-router-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pdd-router-rb
subjects:
  - kind: ServiceAccount
    name: pdd-router-sa
roleRef:
  kind: Role
  name: pdd-router-role
  apiGroup: rbac.authorization.k8s.io
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pdd-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdd-router
  template:
    metadata:
      labels:
        app: pdd-router
    spec:
      serviceAccountName: pdd-router-sa
      volumes:
        - name: hf-cache
          hostPath:
            path: /root/.cache/huggingface
            type: DirectoryOrCreate
        - name: temp-python-script       
          configMap:
            name: rs-router-script
      containers:
        - name: router

          image: vllm/vllm-openai-rocm:v0.21.0
          #image: vllm/vllm-openai-rocm:v0.25.0

          imagePullPolicy: Always

          env:
            - name: PREFILL_APP 
              value: "pdd-prefill"
            - name: DECODE_APP
              value: "pdd-decode"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PREFILL_PORT
              value: "8100"
            - name: DECODE_PORT
              value: "8200"
            - name: ROUTER_PORT
              value: "8000"

          command:
            - /bin/bash
            - -ec

          args:
            - |
              set -euo pipefail

              # Optional: Install VS Code Server
              # curl -Lk 'https://code.visualstudio.com/sha/download?build=stable&os=cli-alpine-x64' -o vscode_cli.tar.gz && \
              # tar -xf vscode_cli.tar.gz && \
              # mv code /usr/local/bin/code && \
              # rm vscode_cli.tar.gz

              # To connect using VS Code:
              # Log in the instance using the terminal, and then run the following commands: 
              # code tunnel user login --provider github
              # nohup code tunnel --accept-server-license-terms --name 001 &> output.log &
 
              git clone https://github.com/vllm-project/vllm.git /myvllm

              pip install --no-cache-dir kubernetes requests

              #sleep infinity
            
              python /app/nixl-pdd-router.py 

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

            - name: temp-python-script
              mountPath: /app/nixl-pdd-router.py
              subPath: nixl-pdd-router.py

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pdd-prefill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdd-prefill
  template:
    metadata:
      labels:
        app: pdd-prefill
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          ipvlan-fabric0@net0,
          ipvlan-fabric1@net1,
          ipvlan-fabric2@net2,
          ipvlan-fabric3@net3,
          ipvlan-fabric4@net4,
          ipvlan-fabric5@net5,
          ipvlan-fabric6@net6,
          ipvlan-fabric7@net7
    spec:
      restartPolicy: Always

      nodeSelector:
        doks.digitalocean.com/gpu-brand: amd

      tolerations:
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule

      volumes:
        - name: temp-hf-cache
          hostPath:
            path: /root/.cache/huggingface
            type: DirectoryOrCreate

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi

      containers:
        - name: server

          image: vllm/vllm-openai-rocm:v0.21.0
          #image: vllm/vllm-openai-rocm:v0.25.0

          imagePullPolicy: Always

          ports:
            - containerPort: 8010
              name: http

          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -ex

              apt update
              apt install -y iproute2 net-tools iputils-ping
              apt install -y infiniband-diags ibverbs-utils

              #sleep infinity

              HIP_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 \
              UCX_NET_DEVICES=all \
              UCX_LOG_LEVEL=info \
              UCX_MAX_RNDV_RAILS=4 \
              UCX_IB_TRAFFIC_CLASS=104 \
              VLLM_NIXL_SIDE_CHANNEL_PORT=5600 \
              VLLM_NIXL_SIDE_CHANNEL_HOST=$(ip -4 addr show eth0 | awk '/inet / {print $2}' | cut -d/ -f1) \
              vllm serve Qwen/Qwen3-8B \
                --no-enable-prefix-caching \
                --tensor-parallel-size 8 \
                --host 0.0.0.0 \
                --port 8100 \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}'

          securityContext:
            capabilities:
              add:
                - IPC_LOCK

          volumeMounts:
            - name: temp-hf-cache
              mountPath: /root/.cache/huggingface

            - name: dshm
              mountPath: /dev/shm

          resources:
            limits:
              amd.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric1: 10
              rdma/fabric2: 10
              rdma/fabric3: 10
              rdma/fabric4: 10
              rdma/fabric5: 10
              rdma/fabric6: 10
              rdma/fabric7: 10
            requests:
              amd.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric1: 10
              rdma/fabric2: 10
              rdma/fabric3: 10
              rdma/fabric4: 10
              rdma/fabric5: 10
              rdma/fabric6: 10
              rdma/fabric7: 10

---
